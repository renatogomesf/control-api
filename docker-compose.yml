services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: control-api

    restart: always

    env_file:
      - .env

    ports:
      - 3001:3000

    depends_on:
      - db

  db:
    image: mysql:latest

    ports:
      - 8080:3306

    container_name: mysql_db

    restart: always

    volumes:
      - ./data-api:/var/lib/mysql

    env_file:
      - .env

volumes:
  data-api:
