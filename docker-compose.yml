services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: control_api

    restart: always

    env_file:
      - .env

    ports:
      - 3001:3000

    depends_on:
      - db

  db:
    image: postgres:16-alpine

    ports:
      - 8080:5432

    container_name: postgres_db

    restart: always

    volumes:
      - ./data-api:/var/lib/postgresql/data

    env_file:
      - .env

volumes:
  data-api:
